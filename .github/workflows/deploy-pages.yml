name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Right202209/ccset'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pages/package-lock.json

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
        env:
          PAGES_BASE_PATH: '${{ steps.pages.outputs.base_path }}/'

      - run: npm run smoke
        env:
          PAGES_BASE_PATH: '${{ steps.pages.outputs.base_path }}/'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages/dist

  deploy:
    if: github.repository == 'Right202209/ccset'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
