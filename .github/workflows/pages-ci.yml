name: Pages CI

on:
  pull_request:
    paths:
      - 'pages/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/pages-ci.yml'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

concurrency:
  group: pages-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pages/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: npm run smoke
